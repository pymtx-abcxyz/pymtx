[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pymtx"
version = "0.1.0"
description = "Read Cursor local app history (chats and agent sessions) from disk."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "pymtx contributors" }]
keywords = ["cursor", "history", "chat", "agent", "local"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pymtx = "pymtx.cli:main"

[project.urls]
Homepage = "https://github.com/pymtx-abcxyz/pymtx"
Issues = "https://github.com/pymtx-abcxyz/pymtx/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
