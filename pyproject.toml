[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pymtx"
version = "0.1.1"
description = "Accounts receivable settlement: apply payments and credit memos to open invoices."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "pymtx contributors" }]
keywords = ["accounts-receivable", "settlement", "invoices", "payments", "ar"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
web = ["fastapi>=0.115", "pydantic>=2"]

[project.scripts]
pymtx = "pymtx.cli:main"

[project.urls]
Homepage = "https://github.com/pymtx-abcxyz/pymtx"
Issues = "https://github.com/pymtx-abcxyz/pymtx/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
